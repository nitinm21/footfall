packages:
  - "packages/*"
  - "apps/*"

# esbuild (a vitest dependency) ships a prebuilt platform binary; approve its
# postinstall under pnpm's build-script gating.
allowBuilds:
  esbuild: true

# Single source of truth for shared dependency versions (pnpm catalog).
# Packages reference these with "catalog:" instead of pinning their own.
catalog:
  typescript: ^5.9.0
  vitest: ^3.2.0
  "@biomejs/biome": ^2.2.0
  "@playwright/test": ^1.50.0
  zod: ^3.25.0
