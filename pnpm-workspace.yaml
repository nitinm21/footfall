packages:
  - "packages/*"
  - "apps/*"

# Approve native postinstall builds under pnpm's build-script gating.
# esbuild: vitest's transformer. sharp: Next.js image library.
allowBuilds:
  esbuild: true
  sharp: true

# Single source of truth for shared dependency versions (pnpm catalog).
# Packages reference these with "catalog:" instead of pinning their own.
catalog:
  typescript: ^5.9.0
  vitest: ^3.2.0
  "@biomejs/biome": ^2.2.0
  "@playwright/test": ^1.50.0
  zod: ^3.25.0
  tsx: ^4.19.0
  next: ^15.5.0
  react: ^19.0.0
  react-dom: ^19.0.0
  "@types/react": ^19.0.0
  "@types/react-dom": ^19.0.0
  "@types/node": ^22.0.0
